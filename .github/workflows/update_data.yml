name: Update Electricity Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run transformation
        run: python utils/electricity_to_buckets.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/electricity/bins/processed_data.parquet
          git add -f output/electricity/readings/raw_readings.csv
          git diff --staged --quiet || git commit -m "🔄 Update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          